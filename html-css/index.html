  <script>
    (() => {
      const $tabItems = document.querySelectorAll('.tab-nav-item');
      const $tabContents = document.querySelectorAll('.tab-contents > .tab-content');

      const tabClickHandler = (e) => {
        // タブヘッダとコンテンツからactive classを除去
        [...$tabItems, ...$tabContents].forEach((el) => el.classList.remove('active'));
        // clickイベントのターゲットがa.tab-nav-linkになるためparentのli.tab-nav-itemを取得
        const $targetTab = e.target.closest('.tab-nav-item');
        $targetTab.classList.add('active');
        // clickターゲットの要素番号を取得
        const idx = parseInt($targetTab.dataset.itemIndex);
        $tabContents[idx].classList.add('active');
      };

      // タブヘッダにクリックイベント処理を登録
      [...$tabItems].forEach((el) => el.addEventListener('click', tabClickHandler));
    })();
  </script>

  <script type="module">
    import { createToast } from '/html-css/assets/js/toast.mjs';
    import { LoginContext } from '../database/assets/js/authn.mjs';

    const loginContext = new LoginContext();

    window.$Toast = createToast('js-toast', 'toast-template');

    // 認可 : Sign in 済みの場合は会員メニューを表示
    window.onload = () => {
      [...document.querySelectorAll('[data-authorized]')].forEach((el) => {
        el.dataset.authorized = loginContext.isLogin;
      });
    };

    $Toast.info(`こんにちは, ${loginContext.username} さん！`);

    document.getElementById('signoutLink').addEventListener('click', (e) => {
      // 認可 : Sign out したので会員メニューを非表示
      loginContext.signout(() => {
        [...document.querySelectorAll('[data-authorized]')].forEach((el) => {
          el.dataset.authorized = false;
        });
      });
      location.href = 'signin.html#ssoDisabled';
    });
  </script>
