<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 9 の課題 | Sign in</title>

  <link rel="stylesheet" href="../html-css/assets/css/sanitize.css">
  <link rel="stylesheet" href="../html-css/assets/css/style.css">
</head>
<body>
  
  <header class="header">
    <nav class="header-nav">
      <ul class="nav-menubar">
        <li class="nav-menuitem logo snap-left">
          <a href="/html-css/index.html" class="nav-menulink" title="ここにロゴがあるとする">TOP</a>
        </li>
        <li class="nav-menuitem padding">
        </li>
        <li class="nav-menuitem snap-right" data-authorized="false">
          <a href="" class="nav-menulink">Special</a>
        </li>
        <li class="nav-menuitem snap-right active">
          <a href="/html-css/signin.html" class="nav-menulink">Sign in</a>
        </li>
        <li class="nav-menuitem snap-right">
          <a href="/html-css/signup.html" class="nav-menulink">Sign up</a>
        </li>
        <li class="nav-menuitem snap-right" data-authorized="false">
          <span id="signoutLink" class="nav-menulink">Sign out</span>
        </li>
      </ul>
    </nav>
  </header>

  <main>

    <h1 class="headline">
      Sign in
    </h1>

    <form action="#posted" class="form" method="post">

      <section class="section">
        <div class="flex-container">
          <h1 class="section-headline">Sign in to your account</h1>

          <div class="column">
            <div class="form-content">
              <label for="email" class="form-label">Your email</label>
              <input id="email" type="email" class="form-input"/>
            </div>
            
            <div class="form-content">
              <label for="email" class="form-label">Password</label>
              <input id="password" type="password" class="form-input">
            </div>
            
            <div class="form-content">
              <button id="btnSignin" class="btn submit-btn" type="button">Sign in</button>
            </div>

            <div class="form-content">
              <span class="description">
                Don't have an account yet?  <a href="/html-css/signup.html" class="link">Sign up</a>
              </span>
            </div>
          </div>
        </div>
      </section>

    </form>

  </main>

  <div class="toast-container" id="js-toast">
  </div>
  <template id="toast-template" class="toast-template">
    <div class="toast" data-type="">
      <div class="toast-summary"></div>
      <div class="toast-message"></div>
    </div>
  </template>

  <footer>

  </footer>

  <script type="module">
    import { createToast } from '/html-css/assets/js/toast.mjs';
    import { LoginContext } from '../database/assets/js/authn.mjs';
    import { query2Map } from '../database/assets/js/textUtils.mjs';

    const loginContext = new LoginContext();

    window.$Toast = createToast('js-toast', 'toast-template');

    const hashParams = query2Map(location.hash);

    if (loginContext.isLogin) {
      document.getElementById('email').value = loginContext.email;
      $Toast.info('セキュリティのためパスワードは保存していません');
      
      if (loginContext.isSsoEnabled && !hashParams.ssoDisabled) {
        document.getElementById('password').value = '**********';
        const $signinBtn = document.getElementById('btnSignin');
        $signinBtn.disabled = true;
        $signinBtn.classList.add('ui-state-disabled');
  
        $Toast.info(`こんにちは, ${loginContext.username} さん\n3秒後にTOPページに遷移します`);
  
        setTimeout(() => {
          location.href = 'index.html';
        }, 3000);
      }

    }

    /**
     * Sign in ボタン押下時処理
     */
    document.getElementById('btnSignin').addEventListener('click', async (e) => {
      console.log('### btn click ###', e);
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      loginContext.signin(email, password)
        .then((res) => {
          $Toast.info(`こんにちは、${res.username} さん`);
          console.log(res);
          location.href = 'index.html';
        })
        .catch((err) => {
          $Toast.error(err.message);
        });
      
    });
  </script>
</body>
</html>
